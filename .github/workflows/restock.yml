name: Restock check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test alert instead of a normal check"
        type: boolean
        default: false

concurrency:
  group: restock
  cancel-in-progress: false

permissions:
  contents: write   # lets the job save state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the site
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python3 restock_bot.py --test-notify
          else
            python3 restock_bot.py
          fi

      - name: Save what the bot has seen
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock state"
            git pull --rebase --quiet && git push --quiet
          fi
